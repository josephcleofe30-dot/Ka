<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Shop</title>
<style>
:root{
  --bg:#fff3d1; --paper:#fffdf5; --ink:#171717; --muted:#6a6455;
  --yellow:#ffd84d; --pink:#ff8fb3; --mint:#6ee7b7; --blue:#8ab4ff; --orange:#ff9f5a; --red:#ff5c5c;
  --b:3px solid var(--ink); --sh:5px 5px 0 var(--ink); --sh-s:3px 3px 0 var(--ink);
}
[data-mode=dark]{
  --bg:#17141f; --paper:#241f30; --ink:#f6efe0; --muted:#a79fb8;
  --yellow:#e3b92b; --pink:#d9648f; --mint:#34b38a; --blue:#5b86d6; --orange:#d9833e; --red:#e24b4b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .4s,color .4s;
  background-image:radial-gradient(var(--ink) 1.2px,transparent 1.2px);background-size:26px 26px;background-position:0 0;background-blend-mode:soft-light}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.93;z-index:-1}
button,input,select{font-family:inherit;font-size:1rem;color:var(--ink)}
button{cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}

/* ticker */
.ticker{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;font-weight:700;font-size:.9rem;padding:7px 0}
.ticker div{display:inline-block;animation:marq 28s linear infinite;padding-left:100%}
@keyframes marq{to{transform:translateX(-100%)}}

/* header */
header{display:flex;align-items:center;gap:18px;padding:22px 0 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:52px;height:52px;background:var(--pink);border:var(--b);box-shadow:var(--sh-s);border-radius:14px;display:grid;place-items:center;font-size:28px;animation:wob 3.5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.logo h1{font-size:1.9rem;font-weight:900;letter-spacing:-1px;outline:none;border-bottom:3px dashed transparent;min-width:60px}
.logo h1:hover,.logo h1:focus{border-color:var(--ink)}
.tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tab{border:var(--b);background:var(--paper);padding:10px 18px;border-radius:12px;font-weight:800;box-shadow:var(--sh-s);transition:transform .12s,box-shadow .12s,background .2s}
.tab:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.tab:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.tab.on{background:var(--yellow)}
.tab .pill{background:var(--ink);color:var(--bg);border-radius:99px;padding:1px 8px;font-size:.75rem;margin-left:6px}
.mode{width:46px;height:46px;border:var(--b);border-radius:50%;background:var(--paper);box-shadow:var(--sh-s);font-size:1.3rem;transition:transform .4s}
.mode:hover{transform:rotate(180deg)}

/* common */
.btn{border:var(--b);background:var(--paper);padding:10px 18px;border-radius:12px;font-weight:800;box-shadow:var(--sh-s);transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.y{background:var(--yellow)}.btn.p{background:var(--pink)}.btn.m{background:var(--mint)}.btn.r{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:9px;box-shadow:2px 2px 0 var(--ink)}
.card{background:var(--paper);border:var(--b);border-radius:18px;box-shadow:var(--sh)}
h2{font-size:1.7rem;font-weight:900;letter-spacing:-.5px}
.sub{color:var(--muted);font-weight:600}
.view{animation:vin .45s cubic-bezier(.2,1.1,.4,1) both}
@keyframes vin{from{opacity:0;transform:translateY(24px) rotate(-.6deg)}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
input,select{background:var(--paper);border:var(--b);border-radius:12px;padding:10px 14px;outline:none;font-weight:600;width:100%;transition:box-shadow .15s,transform .15s}
input:focus,select:focus{box-shadow:var(--sh-s);transform:translate(-1px,-1px)}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.stat{padding:16px 18px;transition:transform .15s,box-shadow .15s;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.stat:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:8px 8px 0 var(--ink)}
.stat .l{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
.stat .v{font-size:2.1rem;font-weight:900;letter-spacing:-1px}
.stat .e{float:right;font-size:2rem}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-4deg)}}

/* toolbar */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tools .search{flex:1;min-width:200px}
.tools select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:var(--b);border-radius:99px;background:var(--paper);padding:6px 14px;font-weight:800;font-size:.9rem;transition:all .15s}
.chip:hover{transform:translateY(-3px)}
.chip.on{background:var(--ink);color:var(--bg)}
.vt{display:inline-flex;border:var(--b);border-radius:12px;overflow:hidden;box-shadow:var(--sh-s)}
.vt button{border:0;background:var(--paper);padding:9px 14px;font-weight:800}
.vt button.on{background:var(--blue)}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.pc{padding:16px;position:relative;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;transition:transform .18s,box-shadow .18s}
.pc:hover{transform:translate(-4px,-4px) rotate(-1deg);box-shadow:9px 9px 0 var(--ink)}
.pc .pic{height:110px;border:var(--b);border-radius:14px;display:grid;place-items:center;font-size:3.4rem;margin-bottom:12px;transition:transform .3s}
.pc:hover .pic{transform:scale(1.04) rotate(2deg)}
.pc:hover .pic span{display:inline-block;animation:jig .5s}
@keyframes jig{25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
.pc h3{font-size:1.1rem;font-weight:900}
.pc .meta{color:var(--muted);font-weight:700;font-size:.82rem;display:flex;justify-content:space-between;margin:2px 0 8px}
.price{font-size:1.5rem;font-weight:900}
.tag{position:absolute;top:10px;right:-8px;border:var(--b);border-radius:8px;padding:2px 10px;font-weight:900;font-size:.75rem;transform:rotate(6deg);box-shadow:2px 2px 0 var(--ink)}
.tag.low{background:var(--orange)}.tag.out{background:var(--red)}.tag.ok{background:var(--mint)}
.meter{height:14px;border:var(--b);border-radius:99px;overflow:hidden;background:var(--paper);margin:8px 0}
.meter i{display:block;height:100%;background:var(--mint);width:0;transition:width .9s cubic-bezier(.2,1,.3,1)}
.meter i.low{background:var(--orange)}.meter i.out{background:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step{display:flex;align-items:center;gap:6px;font-weight:900}
.step button{width:30px;height:30px;border:var(--b);border-radius:9px;background:var(--yellow);font-weight:900;line-height:1;box-shadow:2px 2px 0 var(--ink);transition:transform .1s}
.step button:active{transform:translate(2px,2px);box-shadow:none}
.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.5)}}

/* list mode */
.list .pc{display:grid;grid-template-columns:70px 1.4fr 1fr 1fr auto;gap:16px;align-items:center;padding:12px 16px}
.list .pc .pic{height:62px;width:62px;font-size:2rem;margin:0}
.list .tag{position:static;transform:none;display:inline-block}
.list .meter{display:none}
.list-wrap{display:flex;flex-direction:column;gap:14px}
.list-wrap .pc:hover{transform:translate(-3px,-3px)}

/* POS */
.pos{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{border:var(--b);border-radius:16px;background:var(--paper);padding:12px 8px;text-align:center;box-shadow:var(--sh-s);transition:transform .12s,box-shadow .12s;font-weight:800;animation:pop .4s both;position:relative}
.tile:hover{transform:translate(-2px,-2px) rotate(-1.5deg);box-shadow:5px 5px 0 var(--ink)}
.tile:active{transform:translate(3px,3px) scale(.96);box-shadow:none}
.tile .e{font-size:2.3rem;display:block}
.tile small{display:block;color:var(--muted)}
.tile.dis{opacity:.45;pointer-events:none;filter:grayscale(1)}
.cart{padding:18px;position:sticky;top:16px}
.cart h3{font-size:1.3rem;font-weight:900;margin-bottom:10px}
.ci{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:2px dashed var(--muted);animation:cin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes cin{from{opacity:0;transform:translateX(40px) scale(.8)}}
.ci .n{font-weight:800;line-height:1.15}.ci .n small{color:var(--muted);display:block}
.tot{display:flex;justify-content:space-between;font-size:1.7rem;font-weight:900;margin:14px 0 10px}
.cart .empty{text-align:center;padding:26px 0;color:var(--muted);font-weight:700}
.cart .empty b{display:block;font-size:2.6rem;animation:bounce 1.5s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.change{display:flex;justify-content:space-between;font-weight:800;margin:8px 0 12px;min-height:22px}

/* activity */
.sale{padding:14px 18px;margin-bottom:14px;animation:vin .4s both}
.sale.void{opacity:.55}
.sale.void .tt{text-decoration:line-through}
.sale .items{color:var(--muted);font-weight:700;margin-top:4px}

/* stats */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card.pad{padding:20px}
.bar{display:grid;grid-template-columns:100px 1fr 70px;gap:10px;align-items:center;margin:12px 0;font-weight:800}
.bar .tr{height:22px;border:var(--b);border-radius:99px;overflow:hidden;background:var(--paper)}
.bar .tr i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,1,.3,1)}
.lr{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:2px dashed var(--muted);font-weight:800}
.lr:last-child{border:0}.lr .e{font-size:1.6rem}.lr .g{flex:1}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.md{background:var(--paper);border:var(--b);border-radius:22px;box-shadow:10px 10px 0 var(--ink);padding:24px;width:100%;max-width:440px;transform:translateY(40px) rotate(-3deg) scale(.9);transition:transform .35s cubic-bezier(.2,1.5,.4,1);max-height:92vh;overflow:auto}
.ov.open .md{transform:none}
.md h2{margin-bottom:12px}
.md label{display:block;font-weight:900;font-size:.8rem;text-transform:uppercase;letter-spacing:1px;margin:12px 0 5px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.ep{display:flex;flex-wrap:wrap;gap:6px}
.ep button{width:40px;height:40px;border:var(--b);border-radius:10px;background:var(--paper);font-size:1.3rem;transition:transform .12s}
.ep button:hover{transform:scale(1.2) rotate(8deg)}
.ep button.on{background:var(--yellow)}
.err{color:var(--red);font-weight:800;margin-top:6px}

/* toast + confetti */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;align-items:center;z-index:100}
.toast{background:var(--yellow);color:#171717;border:var(--b);border-radius:14px;padding:10px 18px;font-weight:900;box-shadow:var(--sh-s);animation:tin .4s cubic-bezier(.2,1.6,.4,1)}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(40px) scale(.7)}}
@keyframes tout{to{opacity:0;transform:translateY(20px)}}
.cf{position:fixed;top:50%;left:50%;font-size:1.8rem;pointer-events:none;z-index:200;animation:cf 1.3s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

.empty-big{text-align:center;padding:60px 20px;font-weight:800;color:var(--muted)}
.empty-big b{display:block;font-size:4rem;animation:bounce 1.5s infinite}

@media(max-width:900px){.pos{grid-template-columns:1fr}.cart{position:static}.two{grid-template-columns:1fr}
  .list .pc{grid-template-columns:62px 1fr auto}.list .pc .hide-s{display:none}.tabs{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="ticker"><div id="tick"></div></div>
<div class="wrap">
  <header>
    <div class="logo"><div class="mark">🛒</div><h1 id="shopName" contenteditable="true" spellcheck="false" title="Click to rename">Corner Shop</h1></div>
    <nav class="tabs" id="tabs"></nav>
    <button class="mode" id="mode" aria-label="Toggle dark mode">🌙</button>
  </header>
  <div id="view"></div>
</div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="toasts"></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

const CATS=["Drinks","Dairy","Bakery","Grocery","Canned Goods","Snacks"];
const COL={Drinks:"var(--blue)",Dairy:"var(--mint)",Bakery:"var(--yellow)",Grocery:"var(--orange)","Canned Goods":"var(--pink)",Snacks:"var(--red)"};
const EM=["🥤","🥛","🍞","🍜","🥚","🐟","🧃","🧀","🥐","🍚","🥫","💧","🧈","🍩","🍪","🍫","🍿","🍎","🍌","📦"];
const SEED=[["Cola Drink","DR-001","Drinks",25,18,"🥤"],["Fresh Milk","DA-014","Dairy",42,5,"🥛"],["Loaf Bread","BK-006","Bakery",55,12,"🍞"],["Instant Noodles","GR-022","Grocery",15,3,"🍜"],["Brown Eggs","DA-009","Dairy",95,24,"🥚"],["Sardines","CN-018","Canned Goods",28,7,"🐟"],["Orange Juice","DR-004","Drinks",38,14,"🧃"],["Cheddar Cheese","DA-021","Dairy",120,9,"🧀"],["Croissant","BK-011","Bakery",35,4,"🥐"],["Rice 1kg","GR-001","Grocery",62,30,"🍚"],["Corned Beef","CN-007","Canned Goods",58,0,"🥫"],["Mineral Water","DR-010","Drinks",18,48,"💧"],["Choco Cookies","SN-003","Snacks",22,20,"🍪"],["Popcorn","SN-008","Snacks",30,8,"🍿"]].map((a,i)=>({id:i+1,name:a[0],sku:a[1],cat:a[2],price:a[3],stock:a[4],emoji:a[5]}));

let P=ls.get("cs_p",null)||SEED, L=ls.get("cs_l",[]), CFG=ls.get("cs_cfg",{mode:"light",name:"Corner Shop",low:5});
const save=()=>{ls.set("cs_p",P);ls.set("cs_l",L);ls.set("cs_cfg",CFG)};
const U={view:"products",q:"",cat:"All",sort:"name",mode:"grid",pq:"",pcat:"All"};
let cart={}; // pid -> qty
const money=n=>"₱"+Number(n).toLocaleString("en-PH",{maximumFractionDigits:2});
const st=p=>p.stock<=0?"out":p.stock<=CFG.low?"low":"ok";
const stL={ok:"IN STOCK",low:"LOW",out:"SOLD OUT"};
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.round(m/60);return h<24?h+"h ago":Math.round(h/24)+"d ago"};
const isToday=t=>new Date(t).toDateString()===new Date().toDateString();

/* mode + name */
function applyMode(){document.documentElement.dataset.mode=CFG.mode;$("#mode").textContent=CFG.mode==="dark"?"☀️":"🌙";$("#shopName").textContent=CFG.name}
$("#mode").onclick=()=>{CFG.mode=CFG.mode==="dark"?"light":"dark";save();applyMode()};
$("#shopName").onblur=e=>{CFG.name=e.target.textContent.trim()||"Corner Shop";e.target.textContent=CFG.name;save();toast("Shop renamed ✏️")};
$("#shopName").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();e.target.blur()}};

/* ui helpers */
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#toasts").appendChild(t);setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),250)},2200)}
function confetti(){const e=["🎉","✨","🪙","⭐","💖","🛍️"];for(let i=0;i<26;i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%e.length];
  s.style.setProperty("--x",(Math.random()*700-350)+"px");s.style.setProperty("--y",(Math.random()*-500-80)+"px");s.style.setProperty("--r",(Math.random()*720-360)+"deg");document.body.appendChild(s);setTimeout(()=>s.remove(),1400)}}
function count(el,to,fmt){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f)})(t0)}
function runCounts(r=document){$$("[data-n]",r).forEach(el=>count(el,+el.dataset.n,el.dataset.m?money:v=>Math.round(v)))}
function growBars(r=document){setTimeout(()=>$$("[data-w]",r).forEach(b=>b.style.width=b.dataset.w+"%"),60)}
function openM(h){$("#md").innerHTML=h;$("#ov").classList.add("open");setTimeout(()=>{const f=$("#md input");f&&f.focus()},100)}
function closeM(){$("#ov").classList.remove("open")}
$("#ov").onclick=e=>{if(e.target.id==="ov")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
function ask(title,text,ok,fn){openM(`<h2>${esc(title)}</h2><p class="sub">${esc(text)}</p><div class="acts"><button class="btn" id="n">Nope</button><button class="btn r" id="y">${esc(ok)}</button></div>`);$("#n").onclick=closeM;$("#y").onclick=()=>{closeM();fn()}}
function download(name,rows){const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

/* ticker */
function ticker(){const l=P.filter(p=>st(p)!=="ok");const t=l.length?l.map(p=>`${p.emoji} ${p.name}: ${p.stock===0?"SOLD OUT":p.stock+" left"}`).join("   ✦   "):"✨ Everything is stocked — great job!";
  $("#tick").textContent="⚠️ RESTOCK ALERT  ✦  "+t+"   ✦   "}

/* nav */
function tabs(){const open=Object.keys(cart).length;
  $("#tabs").innerHTML=[["products","📦 Products",P.length],["sell","💰 Sell",open||""],["activity","🧾 Activity",L.filter(s=>!s.void).length],["stats","📊 Stats",""]]
  .map(([k,l,c])=>`<button class="tab ${U.view===k?"on":""}" data-v="${k}">${l}${c!==""?`<span class="pill">${c}</span>`:""}</button>`).join("");
  $$(".tab").forEach(b=>b.onclick=()=>{U.view=b.dataset.v;render()})}
function render(){tabs();ticker();const v=$("#view");v.innerHTML="";const d=document.createElement("div");d.className="view";v.appendChild(d);({products:vProducts,sell:vSell,activity:vActivity,stats:vStats})[U.view](d)}

/* ---------- products ---------- */
function vProducts(v){
  const val=P.reduce((a,p)=>a+p.price*p.stock,0);
  v.innerHTML=`<div class="head"><div><h2>Products</h2><p class="sub">Everything on your shelves.</p></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="ex">⬇️ Export</button><button class="btn y" id="add">➕ New product</button></div></div>
  <div class="strip">
   <div class="card stat" style="background:var(--blue)"><span class="e">📦</span><div class="l">Products</div><div class="v" data-n="${P.length}">0</div></div>
   <div class="card stat" style="background:var(--orange);animation-delay:.08s"><span class="e">⚠️</span><div class="l">Low / sold out</div><div class="v" data-n="${P.filter(p=>st(p)!=="ok").length}">0</div></div>
   <div class="card stat" style="background:var(--mint);animation-delay:.16s"><span class="e">💎</span><div class="l">Stock value</div><div class="v" data-n="${val}" data-m="1">0</div></div></div>
  <div class="tools"><input class="search" id="q" placeholder="🔍 Search name or SKU…" value="${esc(U.q)}">
   <select id="so"><option value="name">Sort: A–Z</option><option value="price">Sort: Price</option><option value="stock">Sort: Stock</option></select>
   <div class="vt"><button data-m="grid" class="${U.mode==="grid"?"on":""}">▦ Grid</button><button data-m="list" class="${U.mode==="list"?"on":""}">☰ List</button></div></div>
  <div class="chips" id="chips">${["All",...CATS].map(c=>`<button class="chip ${U.cat===c?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
  <div id="gr"></div>`;
    $("#so").value=U.sort;runCounts(v);
  $("#q").oninput=e=>{U.q=e.target.value;draw()};
  $("#so").onchange=e=>{U.sort=e.target.value;draw()};
  $$(".vt button").forEach(b=>b.onclick=()=>{U.mode=b.dataset.m;$$(".vt button").forEach(x=>x.classList.toggle("on",x===b));draw()});
  $$(".chip").forEach(b=>b.onclick=()=>{U.cat=b.dataset.c;$$(".chip").forEach(x=>x.classList.toggle("on",x===b));draw()});
  $("#add").onclick=()=>pform();
  $("#ex").onclick=()=>{download("products.csv",[["Name","SKU","Category","Price","Stock"],...P.map(p=>[p.name,p.sku,p.cat,p.price,p.stock])]);toast("Exported ⬇️")};
  draw();
}
function draw(){
  const q=U.q.toLowerCase();
  const l=P.filter(p=>(U.cat==="All"||p.cat===U.cat)&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));
  l.sort((a,b)=>U.sort==="name"?a.name.localeCompare(b.name):a[U.sort]-b[U.sort]);
  const g=$("#gr");
  if(!l.length){g.innerHTML=`<div class="empty-big"><b>🕵️</b>Nothing found. Try another search!</div>`;return}
  const max=Math.max(30,...P.map(p=>p.stock));
  const html=l.map((p,i)=>{const s=st(p);return`<div class="card pc" data-id="${p.id}" style="animation-delay:${Math.min(i,14)*40}ms">
   <span class="tag ${s}">${stL[s]}</span>
   <div class="pic" style="background:${COL[p.cat]}"><span>${p.emoji}</span></div>
   <div><h3>${esc(p.name)}</h3><div class="meta"><span>${esc(p.sku)}</span><span class="hide-s">${esc(p.cat)}</span></div></div>
   <div class="hide-s"><div class="price">${money(p.price)}</div></div>
   <div><div class="meter"><i class="${s}" data-w="${Math.min(100,p.stock/max*100)}"></i></div>
   <div class="row"><div class="step"><button data-d="-1">−</button><span class="sv">${p.stock}</span><button data-d="1">+</button></div>
   <div><button class="btn sm" data-e>✏️</button> <button class="btn sm r" data-x>🗑️</button></div></div></div></div>`}).join("");
  g.innerHTML=U.mode==="list"?`<div class="list list-wrap">${html}</div>`:`<div class="grid">${html}</div>`;
  growBars(g);
  $$(".pc",g).forEach(c=>{const p=P.find(x=>x.id==c.dataset.id);
    $$("[data-d]",c).forEach(b=>b.onclick=()=>{p.stock=Math.max(0,p.stock+ +b.dataset.d);save();const sv=$(".sv",c);sv.textContent=p.stock;sv.classList.remove("bump");void sv.offsetWidth;sv.classList.add("bump");
      const s=st(p);const t=$(".tag",c);t.className="tag "+s;t.textContent=stL[s];const m=$(".meter i",c);m.className=s;m.style.width=Math.min(100,p.stock/Math.max(30,...P.map(x=>x.stock))*100)+"%";ticker()});
    $("[data-e]",c).onclick=()=>pform(p);
    $("[data-x]",c).onclick=()=>ask("Delete "+p.name+"?","This can't be undone.","Delete",()=>{c.style.transition="all .3s";c.style.transform="scale(.3) rotate(15deg)";c.style.opacity=0;setTimeout(()=>{P=P.filter(x=>x.id!==p.id);delete cart[p.id];save();toast("Deleted 🗑️");render()},300)})});
}
  function pform(p){
  const e=!!p;let em=p?p.emoji:"📦";
  openM(`<h2>${e?"Edit":"New"} product ${em}</h2><form id="f"><label>Name</label><input id="a" required maxlength="30" value="${e?esc(p.name):""}">
  <div class="r2"><div><label>SKU</label><input id="b" required maxlength="12" value="${e?esc(p.sku):""}"></div><div><label>Category</label><select id="c">${CATS.map(c=>`<option ${e&&p.cat===c?"selected":""}>${c}</option>`).join("")}</select></div></div>
  <div class="r2"><div><label>Price ₱</label><input id="d" type="number" min="0" step="0.01" required value="${e?p.price:""}"></div><div><label>Stock</label><input id="s" type="number" min="0" step="1" required value="${e?p.stock:""}"></div></div>
  <label>Icon</label><div class="ep" id="ep">${EM.map(x=>`<button type="button" class="${x===em?"on":""}">${x}</button>`).join("")}</div><div class="err" id="er"></div>
  <div class="acts"><button type="button" class="btn" id="x">Cancel</button><button class="btn y">${e?"Save":"Add it!"}</button></div></form>`);
  $$("#ep button").forEach(b=>b.onclick=()=>{em=b.textContent;$$("#ep button").forEach(x=>x.classList.toggle("on",x===b))});
  $("#x").onclick=closeM;
  $("#f").onsubmit=ev=>{ev.preventDefault();const sku=$("#b").value.trim().toUpperCase();
    if(P.some(x=>x.sku===sku&&(!e||x.id!==p.id))){$("#er").textContent="SKU already used!";return}
    const d={name:$("#a").value.trim(),sku,cat:$("#c").value,price:parseFloat($("#d").value),stock:parseInt($("#s").value,10),emoji:em};
    if(e){Object.assign(p,d);toast("Saved ✅")}else{P.push({id:Math.max(0,...P.map(x=>x.id))+1,...d});toast("Product added 🎉")}
    save();closeM();render()};
}

/* ---------- sell / POS ---------- */
function vSell(v){
  v.innerHTML=`<div class="head"><div><h2>Quick Sell</h2><p class="sub">Tap items to add them to the basket, then check out.</p></div></div>
  <div class="tools"><input class="search" id="pq" placeholder="🔍 Find an item…" value="${esc(U.pq)}"></div>
  <div class="chips">${["All",...CATS].map(c=>`<button class="chip ${U.pcat===c?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
  <div class="pos"><div class="tiles" id="tiles"></div><div class="card cart" id="cart"></div></div>`;
  $("#pq").oninput=e=>{U.pq=e.target.value;tiles()};
  $$(".chip",v).forEach(b=>b.onclick=()=>{U.pcat=b.dataset.c;$$(".chip",v).forEach(x=>x.classList.toggle("on",x===b));tiles()});
  tiles();drawCart();
}
function tiles(){
  const q=U.pq.toLowerCase();const l=P.filter(p=>(U.pcat==="All"||p.cat===U.pcat)&&(!q||p.name.toLowerCase().includes(q)));
  $("#tiles").innerHTML=l.length?l.map((p,i)=>{const left=p.stock-(cart[p.id]||0);return`<button class="tile ${left<=0?"dis":""}" data-id="${p.id}" style="animation-delay:${Math.min(i,20)*25}ms"><span class="e">${p.emoji}</span>${esc(p.name)}<small>${money(p.price)} · ${left} left</small></button>`}).join(""):`<div class="empty-big" style="grid-column:1/-1"><b>🕵️</b>No items</div>`;
  $$(".tile").forEach(b=>b.onclick=()=>{const p=P.find(x=>x.id==b.dataset.id);if((cart[p.id]||0)>=p.stock)return;cart[p.id]=(cart[p.id]||0)+1;tiles();drawCart();tabs()});
}
function drawCart(){
  const ids=Object.keys(cart);const total=ids.reduce((a,id)=>a+P.find(p=>p.id==id).price*cart[id],0);
  const c=$("#cart");
  c.innerHTML=`<h3>🧺 Basket</h3>${ids.length?ids.map(id=>{const p=P.find(x=>x.id==id);return`<div class="ci"><span style="font-size:1.7rem">${p.emoji}</span><div class="n">${esc(p.name)}<small>${money(p.price)} each</small></div><div class="step"><button data-id="${id}" data-d="-1">−</button><span>${cart[id]}</span><button data-id="${id}" data-d="1">+</button></div></div>`}).join(""):`<div class="empty"><b>🛍️</b>Basket is empty</div>`}
  <div class="tot"><span>Total</span><span>${money(total)}</span></div>
  ${ids.length?`<label class="sub" style="font-weight:900;font-size:.8rem;text-transform:uppercase">Cash received</label><input id="cash" type="number" min="0" step="0.01" placeholder="${total}"><div class="change"><span>Change</span><span id="chg">—</span></div>
  <div style="display:flex;gap:10px"><button class="btn" id="clr">Clear</button><button class="btn m" id="pay" style="flex:1;justify-content:center">✅ Checkout</button></div>`:""}`;
  $$("[data-d]",c).forEach(b=>b.onclick=()=>{const id=b.dataset.id,p=P.find(x=>x.id==id);cart[id]=(cart[id]||0)+ +b.dataset.d;if(cart[id]<=0)delete cart[id];if(cart[id]>p.stock)cart[id]=p.stock;tiles();drawCart();tabs()});
  if(ids.length){
    $("#cash").oninput=e=>{const v=parseFloat(e.target.value);$("#chg").textContent=isNaN(v)?"—":v>=total?money(v-total):"Short "+money(total-v)};
    $("#clr").onclick=()=>{cart={};tiles();drawCart();tabs()};
    $("#pay").onclick=()=>{const cv=$("#cash").value,paid=cv===""?total:parseFloat(cv);
      if(paid<total){toast("Not enough cash 💸");return}
      const items=ids.map(id=>{const p=P.find(x=>x.id==id);p.stock-=cart[id];return{pid:p.id,name:p.name,emoji:p.emoji,qty:cart[id],price:p.price}});
      L.unshift({id:Math.max(1000,...L.map(s=>s.id))+1,t:Date.now(),items,total,paid,void:false});
      cart={};save();confetti();toast(`Sold! ${money(total)} 🎉`+(paid>total?` · change ${money(paid-total)}`:""));render()};
  }
}

/* ---------- activity ---------- */
function vActivity(v){
  const live=L.filter(s=>!s.void);
  v.innerHTML=`<div class="head"><div><h2>Activity</h2><p class="sub">${live.length} sales · ${money(live.reduce((a,s)=>a+s.total,0))} total</p></div>
   <button class="btn" id="ex">⬇️ Export sales</button></div>
   ${L.length?L.map((s,i)=>`<div class="card sale ${s.void?"void":""}" style="animation-delay:${Math.min(i,10)*50}ms"><div class="row"><div><b class="tt" style="font-size:1.2rem">Sale #${s.id} · ${money(s.total)}</b> <span class="sub">${ago(s.t)}</span></div>
     ${s.void?`<span class="tag ok" style="position:static;transform:none;background:var(--red)">VOIDED</span>`:`<button class="btn sm r" data-v="${s.id}">↩️ Void</button>`}</div>
     <div class="items">${s.items.map(it=>`${it.emoji} ${esc(it.name)} ×${it.qty}`).join("  ·  ")}</div></div>`).join(""):`<div class="empty-big"><b>🧾</b>No sales yet — go to Sell and ring one up!</div>`}`;
  $("#ex").onclick=()=>{download("sales.csv",[["Sale","Date","Items","Total","Voided"],...L.map(s=>[s.id,new Date(s.t).toISOString(),s.items.map(i=>i.name+" x"+i.qty).join("; "),s.total,s.void])]);toast("Exported ⬇️")};
  $$("[data-v]",v).forEach(b=>b.onclick=()=>ask("Void this sale?","Items go back into stock.","Void it",()=>{const s=L.find(x=>x.id==b.dataset.v);s.void=true;s.items.forEach(it=>{const p=P.find(x=>x.id===it.pid);if(p)p.stock+=it.qty});save();toast("Sale voided ↩️");render()}));
}

/* ---------- stats ---------- */
function vStats(v){
  const live=L.filter(s=>!s.void),today=live.filter(s=>isToday(s.t));
  const tSales=today.reduce((a,s)=>a+s.total,0),tItems=today.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0);
  const byC=CATS.map(c=>({c,n:P.filter(p=>p.cat===c).reduce((a,p)=>a+p.price*p.stock,0)}));const mx=Math.max(1,...byC.map(x=>x.n));
  const sold={};live.forEach(s=>s.items.forEach(i=>{sold[i.name]=sold[i.name]||{q:0,e:i.emoji,t:0};sold[i.name].q+=i.qty;sold[i.name].t+=i.qty*i.price}));
  const top=Object.entries(sold).sort((a,b)=>b[1].q-a[1].q).slice(0,5);
  const low=P.filter(p=>st(p)!=="ok").sort((a,b)=>a.stock-b.stock).slice(0,6);
  v.innerHTML=`<div class="head"><div><h2>Stats</h2><p class="sub">How the shop is doing.</p></div></div>
  <div class="strip"><div class="card stat" style="background:var(--mint)"><span class="e">💰</span><div class="l">Today's sales</div><div class="v" data-n="${tSales}" data-m="1">0</div></div>
   <div class="card stat" style="background:var(--yellow);animation-delay:.08s"><span class="e">🛍️</span><div class="l">Items sold today</div><div class="v" data-n="${tItems}">0</div></div>
   <div class="card stat" style="background:var(--pink);animation-delay:.16s"><span class="e">🧾</span><div class="l">All-time sales</div><div class="v" data-n="${live.reduce((a,s)=>a+s.total,0)}" data-m="1">0</div></div>
   <div class="card stat" style="background:var(--blue);animation-delay:.24s"><span class="e">🧮</span><div class="l">Avg. basket</div><div class="v" data-n="${live.length?live.reduce((a,s)=>a+s.total,0)/live.length:0}" data-m="1">0</div></div></div>
  <div class="two"><div class="card pad"><h2 style="font-size:1.3rem">Stock value by aisle</h2>${byC.map(x=>`<div class="bar"><span>${x.c}</span><div class="tr"><i data-w="${x.n/mx*100}" style="background:${COL[x.c]}"></i></div><span>${money(x.n)}</span></div>`).join("")}</div>
   <div class="card pad"><h2 style="font-size:1.3rem">🏆 Best sellers</h2>${top.length?top.map(([n,d])=>`<div class="lr"><span class="e">${d.e}</span><span class="g">${esc(n)}</span><span>${d.q} sold</span></div>`).join(""):`<p class="sub" style="margin-top:12px">Make a sale to see your best sellers.</p>`}
   <h2 style="font-size:1.3rem;margin-top:22px">⚠️ Restock soon</h2>${low.length?low.map(p=>`<div class="lr"><span class="e">${p.emoji}</span><span class="g">${esc(p.name)}</span><span>${p.stock} left</span><button class="btn sm y" data-r="${p.id}">+10</button></div>`).join(""):`<p class="sub" style="margin-top:12px">All good! 🎉</p>`}</div></div>`;
  runCounts(v);growBars(v);
  $$("[data-r]",v).forEach(b=>b.onclick=()=>{const p=P.find(x=>x.id==b.dataset.r);p.stock+=10;save();toast(`Restocked ${p.name} 📦`);render()});
}

applyMode();render();
</script>
</body>
</html>
